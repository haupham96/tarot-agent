<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tarot Agent — Prototype</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body, #root {
    height: 100%; margin: 0; padding: 0;
    background: #030108;
    font-family: -apple-system, system-ui, sans-serif;
    color: #fff;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }

  /* Scrollbars — hide but keep scroll */
  *::-webkit-scrollbar { width: 0; height: 0; }

  /* Animations */
  @keyframes fog-drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-5%, 2%) scale(1.05); }
  }
  @keyframes particle-rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    50% { transform: translateY(-50vh) translateX(10px); opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-110vh) translateX(-20px); opacity: 0; }
  }
  @keyframes card-float {
    0% { transform: translateY(0) rotate(-2deg); }
    100% { transform: translateY(-14px) rotate(2deg); }
  }
  @keyframes fade-pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  @keyframes hint-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
  @keyframes screen-fade-in {
    0% { opacity: 0; transform: scale(1.015); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tarot-data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tarot-cards.jsx"></script>
<script type="text/babel" src="tarot-screens.jsx"></script>
<script type="text/babel" src="tarot-app.jsx"></script>
</body>
</html>
