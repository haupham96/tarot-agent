<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Callback - Tarot Agent</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f4ef;
    --surface: #ffffff;
    --text: #1f1b16;
    --muted: #645b52;
    --border: #ddd6cc;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }

  main {
    max-width: 760px;
    margin: 48px auto;
    padding: 40px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  h1 {
    margin: 0 0 24px;
    font-size: 2rem;
    line-height: 1.2;
  }

  .field {
    margin: 0 0 20px;
  }

  .field .label {
    display: block;
    margin: 0 0 6px;
    font-weight: bold;
    color: var(--muted);
  }

  .field .value {
    display: block;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.95rem;
    word-break: break-all;
    white-space: pre-wrap;
  }

  .field .value.empty {
    color: var(--muted);
    font-style: italic;
  }

  @media (max-width: 640px) {
    main {
      margin: 20px;
      padding: 28px 20px;
    }
  }
</style>
</head>
<body>
<main>
  <h1>TikTok OAuth Callback</h1>

  <div class="field">
    <span class="label">code</span>
    <code class="value" id="code"></code>
  </div>

  <div class="field">
    <span class="label">state</span>
    <code class="value" id="state"></code>
  </div>
</main>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);

    function render(id, value) {
      var el = document.getElementById(id);
      if (value === null || value === "") {
        el.textContent = "(empty)";
        el.classList.add("empty");
      } else {
        el.textContent = value;
      }
    }

    render("code", params.get("code"));
    render("state", params.get("state"));
  })();
</script>
</body>
</html>
